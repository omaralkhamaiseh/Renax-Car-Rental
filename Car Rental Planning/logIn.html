<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Renax | Login</title>

    <style>

        body {
            background-color: black;
            font-family: Arial, sans-serif;
            margin: 0;
            color: white;
        }

        

        #bar {
            background-color: #141414;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 30px;
        }

        #logo {
            color: #D4A64A;
            font-size: 32px;
        }

        #barlinks {
            display: flex;
            gap: 30px;
        }

        #barlinks a {
            color: white;
            text-decoration: none;
            font-size: 20px;
        }

        #barlinks a:hover {
            color: #D4A64A;
        }

        

        #login {
            text-align: center;
            padding: 50px 20px;
        }

        #subtitle {
            color: #D4A64A;
            font-size: 22px;
            letter-spacing: 5px;
        }

        #title {
            color: white;
            font-size: 36px;
        }

        #login-form {
            background-color: #141414;
            width: 400px;
            max-width: 90%;
            margin: 30px auto;
            padding: 30px;
            border: 1px solid #D4A64A;
            border-radius: 12px;
            text-align: left;
        }

        #login-form label {
            display: block;
            color: white;
            margin-bottom: 8px;
        }

        #login-form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background-color: black;
            color: white;
            border: 1px solid grey;
            border-radius: 6px;
            box-sizing: border-box;
        }

        #login-form input[type="submit"] {
            background-color: #D4A64A;
            color: black;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        #login-form input[type="submit"]:hover {
            background-color: white;
        }

        #signup-link {
            text-align: center;
            color: #CCCCCC;
        }

        #signup-link a {
            color: #D4A64A;
            text-decoration: none;
        }

    </style>

</head>

<body>

    

    <div id="bar">

        <h2 id="logo">Renax</h2>

        <div id="barlinks">
            <a href="index.html">Home</a>
            <a href="cars.html">Cars</a>
            <a href="AboutUs.html">About Us</a>
            <a href="Contact.html">Contact</a>
        </div>

    </div>


    

    <div id="login">

        <p id="subtitle">WELCOME BACK</p>

        <h1 id="title">Login to Renax</h1>

        <div id="login-form">

            <form>

                <label>Email</label>
                <input type="email" name="email"
                placeholder="Enter your email" required>

                <label>Password</label>
                <input type="password" name="password"
                placeholder="Enter your password" required>

                <input type="submit" value="Login">

            </form>

            <p id="signup-link">
                Don't have an account?
                <a href="signup.html">Sign Up</a>
            </p>

        </div>

    </div>

</body>

</html>
