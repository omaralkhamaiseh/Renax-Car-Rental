<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Renax | Login</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      body {
        background-color: black;
        font-family: Arial, sans-serif;
        margin: 0;
        color: white;
      }
      #login {
        text-align: center;
        padding: 50px 20px;
      }

      #subtitle {
        color: #d4a64a;
        font-size: 22px;
        letter-spacing: 5px;
      }

      #title {
        color: white;
        font-size: 36px;
      }

      #login-form {
        background-color: #141414;
        width: 400px;
        max-width: 90%;
        margin: 30px auto;
        padding: 30px;
        border: 1px solid #d4a64a;
        border-radius: 12px;
        text-align: left;
      }

      #login-form label {
        display: block;
        color: white;
        margin-bottom: 8px;
      }

      #login-form input {
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        background-color: black;
        color: white;
        border: 1px solid grey;
        border-radius: 6px;
        box-sizing: border-box;
      }

      #login-form input[type="submit"] {
        background-color: #d4a64a;
        color: black;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        border: none;
      }

      #login-form input[type="submit"]:hover {
        background-color: white;
      }

      #signup-link {
        text-align: center;
        color: #cccccc;
      }

      #signup-link a {
        color: #d4a64a;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <div id="bar">
      <h2 id="logo">Renax</h2>

      <div id="barlinks">
        <a href="index.html">Home</a>
        <a href="OurCars.html">Cars</a>
        <a href="AboutUs.html">About Us</a>
        <a href="Contact.html">Contact</a>
      </div>
      <div id="enterbtn">
        <a href="signnup.html">Sign Up</a>
        <a href="logIn.html">Login</a>
      </div>
    </div>

    <div id="login">
      <p id="subtitle">WELCOME BACK</p>

      <h1 id="title">Login to Renax</h1>

      <div id="login-form">
        <form>
          <label>Email</label>
          <input type="email" name="email" required />

          <label>Password</label>
          <input type="password" name="password" required />

          <input type="submit" value="Login" />
        </form>

        <p id="signup-link">
          Don't have an account?
          <a href="signnup.html">Sign Up</a>
        </p>
      </div>
    </div>
  </body>
</html>
