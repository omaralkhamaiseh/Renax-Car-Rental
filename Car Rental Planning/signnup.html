<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Renax | Sign Up</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      body {
        background-color: black;
        font-family: Arial, sans-serif;
        margin: 0;
        color: white;
      }
      #signup {
        text-align: center;
        padding: 40px 20px;
      }

      #subtitle {
        color: #d4a64a;
        font-size: 22px;
        letter-spacing: 5px;
      }

      #title {
        color: white;
        font-size: 36px;
      }

      #signup-form {
        background-color: #141414;
        width: 400px;
        max-width: 90%;
        margin: 30px auto;
        padding: 30px;
        border: 1px solid #d4a64a;
        border-radius: 12px;
        text-align: left;
      }
      #signup-form input {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        background-color: black;
        color: white;
        border: 1px solid grey;
        border-radius: 6px;
      }
      #signup-form input[type="submit"] {
        background-color: #d4a64a;
        color: black;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        border: none;
      }

      #signup-form input[type="submit"]:hover {
        background-color: white;
      }

      #login-link {
        text-align: center;
        color: #cccccc;
      }

      #login-link a {
        color: #d4a64a;
        text-decoration: none;
      }
    </style>
  </head>

  <body>
    <div id="bar">
      <h2 id="logo">Renax</h2>

      <div id="barlinks">
        <a href="index.html">Home</a>
        <a href="OurCars.html">Cars</a>
        <a href="AboutUs.html">About Us</a>
        <a href="Contact.html">Contact</a>
      </div>
      <div id="enterbtn">
        <a href="signnup.html">Sign Up</a>
        <a href="logIn.html">Login</a>
      </div>
    </div>

    <div id="signup">
      <p id="subtitle">JOIN RENAX</p>

      <h1 id="title">Create Your Account</h1>

      <div id="signup-form">
        <form>
          Full Name:
          <input type="text" name="fullname" required />

          Email:
          <input type="email" name="email" required />

          Phone Number:
          <input type="tel" name="phone" required />

          Password:
          <input type="password" name="password" required />

          <input type="submit" value="Create Account" />
        </form>

        <p id="login-link">
          Already have an account?
          <a href="logIn.html">Login</a>
        </p>
      </div>
    </div>
  </body>
</html>
