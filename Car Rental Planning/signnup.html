<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Renax | Sign Up</title>

    <style>

        body {
            background-color: black;
            font-family: Arial, sans-serif;
            margin: 0;
            color: white;
        }

       

        #bar {
            background-color: #141414;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 30px;
        }

        #logo {
            color: #D4A64A;
            font-size: 32px;
        }

        #barlinks {
            display: flex;
            gap: 30px;
        }

        #barlinks a {
            color: white;
            text-decoration: none;
            font-size: 20px;
        }

        #barlinks a:hover {
            color: #D4A64A;
        }

        

        #signup {
            text-align: center;
            padding: 40px 20px;
        }

        #subtitle {
            color: #D4A64A;
            font-size: 22px;
            letter-spacing: 5px;
        }

        #title {
            color: white;
            font-size: 36px;
        }

        #signup-form {
            background-color: #141414;
            width: 400px;
            max-width: 90%;
            margin: 30px auto;
            padding: 30px;
            border: 1px solid #D4A64A;
            border-radius: 12px;
            text-align: left;
        }

        #signup-form label {
            display: block;
            color: white;
            margin-bottom: 8px;
        }

        #signup-form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background-color: black;
            color: white;
            border: 1px solid grey;
            border-radius: 6px;
            box-sizing: border-box;
        }

        #signup-form input[type="submit"] {
            background-color: #D4A64A;
            color: black;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        #signup-form input[type="submit"]:hover {
            background-color: white;
        }

        #login-link {
            text-align: center;
            color: #CCCCCC;
        }

        #login-link a {
            color: #D4A64A;
            text-decoration: none;
        }

    </style>

</head>

<body>

    

    <div id="bar">

        <h2 id="logo">Renax</h2>

        <div id="barlinks">
            <a href="index.html">Home</a>
            <a href="cars.html">Cars</a>
            <a href="AboutUs.html">About Us</a>
            <a href="contact.html">Contact</a>
        </div>

    </div>


   

    <div id="signup">

        <p id="subtitle">JOIN RENAX</p>

        <h1 id="title">Create Your Account</h1>

        <div id="signup-form">

            <form>

               Full Name:
                <input type="text" name="fullname"
                placeholder="Enter your full name" required>

                Email:
                <input type="email" name="email"
                placeholder="Enter your email" required>

                Phone Number:
                <input type="tel" name="phone"
                placeholder="Enter your phone number">

                Password:
                <input type="password" name="password"
                placeholder="Create a password" required>

                <input type="submit" value="Create Account">

            </form>

            <p id="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

        </div>

    </div>

</body>

</html>
